<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes · wpp-freela</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --txt: #1b1f24; --sub: #667085; --linha: #e4e7ec;
    --verde: #16a34a; --verde-bg: #dcfce7; --verm: #dc2626; --verm-bg: #fee2e2;
    --azul: #2563eb; --azul-bg: #dbeafe; --amar: #a16207; --amar-bg: #fef9c3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #171a21; --txt: #e6e8eb; --sub: #98a2b3; --linha: #2a2f3a;
      --verde-bg: #14391f; --verm-bg: #3b1616; --azul-bg: #172554; --amar: #facc15; --amar-bg: #3a3413; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.4 system-ui, Segoe UI, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--linha); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { font-size: 16px; margin: 0 6px 0 0; }
  button, a.botao { font: inherit; border: 1px solid var(--linha); background: var(--card); color: var(--txt); border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none; white-space: nowrap; display: inline-block; }
  button:hover, a.botao:hover { border-color: var(--azul); }
  button.ativo { background: var(--azul); border-color: var(--azul); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  a.zap { background: var(--verde); border-color: var(--verde); color: #fff; font-weight: 600; }
  input { font: inherit; color: var(--txt); background: var(--card); border: 1px solid var(--linha); border-radius: 6px; padding: 5px 8px; min-width: 200px; }
  .pill { padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .responder { background: var(--verde-bg); color: var(--verde); }
  .aguardando { background: var(--azul-bg); color: var(--azul); }
  .sem-resposta, .sem-conversa { background: var(--linha); color: var(--sub); }
  .novas { background: var(--verm); color: #fff; }
  .sub { color: var(--sub); font-size: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  .cli { background: var(--card); border: 1px solid var(--linha); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 14px; }
  .cli.quente { border-left: 4px solid var(--verde); }
  @media (max-width: 760px) { .cli { grid-template-columns: 1fr; } }
  .topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .nome { font-weight: 700; font-size: 15px; }
  .proj { border-top: 1px dashed var(--linha); padding-top: 8px; margin-top: 8px; }
  .proj b { display: block; margin-bottom: 4px; }
  .acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .msgs { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; background: var(--bg); border-radius: 8px; padding: 8px; }
  .m { max-width: 85%; padding: 5px 9px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  .m.eu { align-self: flex-end; background: var(--azul-bg); }
  .m.ele { align-self: flex-start; background: var(--card); border: 1px solid var(--linha); }
  .m.nova { border-color: var(--verde); box-shadow: 0 0 0 1px var(--verde); }
  .m .sub { display: block; font-size: 11px; }
  .vazio { text-align: center; color: var(--sub); padding: 40px; }
  #aviso { min-height: 1em; }
</style>
</head>
<body>
<header>
  <h1>Clientes no WhatsApp</h1>
  <span id="filtros"></span>
  <input id="busca" placeholder="buscar nome, número, projeto…">
  <span style="flex:1"></span>
  <span id="aviso" class="sub"></span>
  <button id="bAtualizar">↻ Atualizar</button>
  <a class="botao" href="/">Painel</a>
</header>
<main id="lista"><div class="vazio">lendo o WhatsApp…</div></main>
<script>
const FILTROS = [["todos", "Todos"], ["responder", "Responder"], ["aguardando", "Aguardando ele"], ["sem resposta", "Sem resposta"]];
let clientes = [], filtro = "todos";
try { filtro = localStorage.getItem("clientes-filtro") || "todos"; } catch {}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const quando = (iso) => {
  if (!iso) return "";
  const d = new Date(iso), min = (Date.now() - d) / 60000;
  if (min < 60) return `há ${Math.max(1, Math.round(min))} min`;
  if (min < 1440) return `há ${Math.round(min / 60)} h`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
};
const fone = (n) => { const d = String(n); return d.length >= 12 ? `(${d.slice(2, 4)}) ${d.slice(4, -4)}-${d.slice(-4)}` : d; };

async function abrirNoChrome(url, botao) {
  botao.disabled = true;
  try {
    const r = await fetch("/api/abrir-no-chrome", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || r.status);
  } catch (e) {
    window.open(url, "_blank"); // Chrome do robô fechado: abre aqui mesmo
  } finally {
    botao.disabled = false;
  }
}

function desenharFiltros() {
  const conta = (f) => f === "todos" ? clientes.length : clientes.filter((c) => c.status === f).length;
  document.getElementById("filtros").innerHTML = FILTROS.map(([f, t]) =>
    `<button data-f="${f}" class="${f === filtro ? "ativo" : ""}">${t} (${conta(f)})</button>`).join(" ");
}

function desenhar() {
  desenharFiltros();
  const q = document.getElementById("busca").value.trim().toLowerCase();
  const vis = clientes.filter((c) => (filtro === "todos" || c.status === filtro) &&
    (!q || [c.numero, ...c.nomes, ...c.projetos.map((p) => p.projeto), ...c.msgs.map((m) => m.texto)].join(" ").toLowerCase().includes(q)));
  const lista = document.getElementById("lista");
  if (!vis.length) { lista.innerHTML = `<div class="vazio">ninguém aqui</div>`; return; }
  lista.innerHTML = vis.map((c, i) => {
    const minha = c.msgs.findLast((m) => m.deMim)?.quando;
    const msgs = c.msgs.length
      ? c.msgs.map((m) => `<div class="m ${m.deMim ? "eu" : "ele"} ${!m.deMim && (!minha || m.quando > minha) ? "nova" : ""}">${esc(m.texto)}<span class="sub">${quando(m.quando)}</span></div>`).join("")
      : `<div class="sub">sem mensagens no WhatsApp</div>`;
    const projs = c.projetos.map((p) => `
      <div class="proj"><b>${esc(p.projeto)}</b>${p.orcamento ? `<span class="sub">${esc(p.orcamento)}</span>` : ""}
        <div class="acoes">
          ${p.conversa ? `<button data-abrir="${esc(p.conversa)}">💬 Conversa no site</button>` : ""}
          ${p.projetoUrl ? `<button data-abrir="${esc(p.projetoUrl)}">📄 Projeto</button>` : ""}
          ${!p.conversa && !p.projetoUrl ? `<span class="sub">sem link do site</span>` : ""}
        </div></div>`).join("");
    return `<section class="cli ${c.status === "responder" ? "quente" : ""}">
      <div>
        <div class="topo">
          <span class="nome">${esc(c.nomes[0] || "sem nome")}</span>
          <span class="pill ${c.status.replace(" ", "-")}">${esc(c.status)}</span>
          ${c.novas ? `<span class="pill novas">${c.novas} nova${c.novas > 1 ? "s" : ""}</span>` : ""}
        </div>
        <div class="sub">${fone(c.numero)} · ${quando(c.ultima)}${c.nomes.length > 1 ? " · também: " + esc(c.nomes.slice(1).join(", ")) : ""}</div>
        <div class="acoes">
          <a class="botao zap" href="https://web.whatsapp.com/send?phone=${c.numero}" target="_blank">WhatsApp Web</a>
          <a class="botao" href="whatsapp://send?phone=${c.numero}">App</a>
          <button data-copiar="${c.numero}">copiar nº</button>
        </div>
        ${projs || `<div class="proj sub">não achei projeto do site pra esse número</div>`}
      </div>
      <div class="msgs" id="m${i}">${msgs}</div>
    </section>`;
  }).join("");
  vis.forEach((_, i) => { const el = document.getElementById(`m${i}`); el.scrollTop = el.scrollHeight; });
}

async function carregar() {
  const b = document.getElementById("bAtualizar"), aviso = document.getElementById("aviso");
  b.disabled = true; aviso.textContent = "lendo o WhatsApp…";
  try {
    const r = await fetch("/api/clientes");
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro);
    clientes = d.clientes;
    const novas = clientes.reduce((s, c) => s + c.novas, 0);
    aviso.textContent = `${clientes.filter((c) => c.status === "responder").length} pra responder · ${novas} msgs novas · lido ${new Date(d.lidoEm).toLocaleTimeString("pt-BR")}`;
    document.title = (novas ? `(${novas}) ` : "") + "Clientes · wpp-freela";
    desenhar();
  } catch (e) {
    aviso.textContent = "";
    document.getElementById("lista").innerHTML = `<div class="vazio">Erro: ${esc(e.message)} — <a href="/qr" target="_blank">conectar WhatsApp</a></div>`;
  } finally {
    b.disabled = false;
  }
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.f) { filtro = t.dataset.f; try { localStorage.setItem("clientes-filtro", filtro); } catch {} desenhar(); }
  if (t.dataset.abrir) abrirNoChrome(t.dataset.abrir, t);
  if (t.dataset.copiar) { navigator.clipboard?.writeText(t.dataset.copiar); t.textContent = "copiado ✓"; setTimeout(() => (t.textContent = "copiar nº"), 1500); }
  if (t.id === "bAtualizar") carregar();
});
document.getElementById("busca").addEventListener("input", desenhar);
carregar();
setInterval(carregar, 2 * 60 * 1000);
</script>
</body>
</html>
